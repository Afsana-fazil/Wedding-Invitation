<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shakkir S M & Afsana F S - Wedding Invitation</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>
    <div class="splash-envelope">
        <div class="envelope">
            <img src="assets/img5.png" alt="splash-screen" class="front-image" />
            <!-- Wax seal -->
            <div class="wax-seal">
                <div class="seal-inner">
                    <span>S</span>
                    <span>A</span>
                    <small>✦</small>
                </div>
            </div>

        </div>

    </div>

   <div class="music-player">
        <button id="musicToggle" class="music-btn" aria-label="Toggle music" type="button">
            <span id="musicIcon">🔊</span>
        </button>

        <audio id="weddingAudio" loop autoplay>
            <source src="./assets/song.mp3" type="audio/mpeg">
        </audio>
    </div>
    <section class="hero">
        <div class="content first">
            <img src="assets/img1.png" alt="Image">
        </div>
        <div class="content">
            <img src="assets/img2.png" alt="Image2">
        </div>
        <section class="content container">
            <img src="assets/img3.png" alt="Image3">
            <section class="countdown-section">
                <div class="countdown-container">
                    <p class="countdown-label">COUNTING DOWN TO OUR SPECIAL DAY</p>
                    <div class="gold-divider">
                        <span></span>
                        <b>✦</b>
                        <span></span>
                    </div>
                    <div class="countdown" id="countdown">
                        <div class="time-box">
                            <span id="days">00</span>
                            <small>Days</small>
                        </div>

                        <div class="separator">:</div>

                        <div class="time-box">
                            <span id="hours">00</span>
                            <small>Hours</small>
                        </div>

                        <div class="separator">:</div>

                        <div class="time-box">
                            <span id="minutes">00</span>
                            <small>Minutes</small>
                        </div>

                        <div class="separator">:</div>

                        <div class="time-box">
                            <span id="seconds">00</span>
                            <small>Seconds</small>
                        </div>
                    </div>

                </div>
            </section>
        </section>
        <div class="content">
            <img src="assets/img4.png" alt="Image4">
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
